
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f4f8;
            text-align: center;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #1e293b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: yellow;
        }

        main {
            padding: 50px 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        footer {
            background-color: #1e293b;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>A simple website made with HTML and CSS</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
    </nav>

    <main>
        <section id="home" class="card">
            <h2>Home</h2>
            <p>Welcome to my first website!</p>
            <button onclick="alert('Hello! Welcome to my website!')">
                Click Me
            </button>
        </section>

        <section id="about" class="card">
            <h2>About Us</h2>
            <p>This website is created using HTML and CSS.</p>
        </section>

        <section id="services" class="card">
            <h2>Our Services</h2>
            <p>We provide web design and development services.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Simple Website</p>
    </footer>

</body>
</html>
